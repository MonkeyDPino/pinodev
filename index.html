    <!-- Theme bootstrap — APPROVED #1869. Restores a previously chosen
         LIGHT preference before first paint; dark needs no JS at all,
         since :root already carries the dark tokens (A2). Runs before
         the stylesheet link so the attribute is set before CSS resolves
         custom properties. System color-scheme preference is
         deliberately not consulted when nothing is stored (dark-first
         is an identity decision, not an OS mirror). -->
    <script>
      try {
        var t = localStorage.getItem("pinodev-theme");
        if (t === "light") document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    </script>
